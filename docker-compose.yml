version: '3.8'

services:
  db:
    image: postgres:15
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: zXc1@3aSd
      POSTGRES_DB: repair_service
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    networks:
      - app-network

  server:
    build: ./server
    ports:
      - "5000:5000"
    environment:
      - DB_HOST=db
      - DB_PORT=5432
      - DB_USER=postgres
      - DB_PASSWORD=zXc1@3aSd
      - DB_NAME=repair_service
      - ML_SERVICE_URL=http://ml-service:5001
      - CLIENT_URL=http://localhost:5173
    depends_on:
      - db
    networks:
      - app-network

  ml-service:
    build: ./ml-service
    ports:
      - "5001:5001"
    networks:
      - app-network

  client:
    build: ./client
    ports:
      - "5173:80"
    depends_on:
      - server
    networks:
      - app-network

volumes:
  pgdata:

networks:
  app-network:
    driver: bridge
